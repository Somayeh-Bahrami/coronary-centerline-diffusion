# Paired control: 30,000 fresh optimizer steps from the frozen 150k milestone.
# Resolve the data/checkpoint paths for the target machine before execution.
data:
  packaged_dir: data/processed/ds105_full

train:
  hidden_dim: 384
  batch_size: 16
  lr: 3.0e-5
  max_steps: 30000
  warmup_steps: 1000
  eta_min_ratio: 0.1
  early_stopping: false
  early_stop_min_steps: 150000
  patience: 30
  min_delta: 1.0e-4
  val_every: 1000
  checkpoint_every: 1000
  milestone_every: 5000
  log_every: 50
  max_hours: 2.0
  cond_drop_prob: 0.10
  self_cond_p: 0.50
  precision: bf16
  grad_clip_norm: 0.0
  seed: 20260911
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
  allow_tf32: true
  cudnn_benchmark: true
  compile: false
  device: cuda
  resume_mode: fresh
  init_checkpoint: outputs/h384_200k/checkpoints/milestones/step_150000.pt
  checkpoint_dir: outputs/paired_ft_30k/control
  coh_weight: 0.0
  edge_cache: null
  coh_huber_beta: 0.05
  coh_weight_by_abar: true
  coh_hinge_k: 0.0
  coh_hinge_weight: 0.0
  coh_group_balanced: false
  coh_consecutive_weight: 0.0
  coh_nonconsecutive_weight: 0.0
  quick_steps: 20
  quick_val_every: 10

eval:
  split: val
  bounds: physical
  overlap_thresholds_mm: [1.0, 2.0, 5.0]
  sampler_steps_grid: [25, 50, 100]
  guidance_grid: [1.0, 2.0]
  sampling_seeds: [104729, 130363, 155921, 181081, 205019]
