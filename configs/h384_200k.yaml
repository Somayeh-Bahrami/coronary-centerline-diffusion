# Clean h384 / 200k baseline. Molab writes a resolved copy with absolute paths.

data:
  packaged_dir: data/processed/ds105_full

train:
  hidden_dim: 384
  batch_size: 16
  lr: 3.0e-4
  max_steps: 200000
  warmup_steps: 2000
  eta_min_ratio: 0.01

  # Finish the complete cosine schedule. Numerical best.pt is still retained.
  early_stopping: false
  early_stop_min_steps: 150000
  patience: 30
  min_delta: 1.0e-4

  val_every: 1000
  checkpoint_every: 1000
  milestone_every: 25000
  log_every: 50
  max_hours: 11.0          # per session; leaves margin below a 12 h runtime cap

  cond_drop_prob: 0.10
  self_cond_p: 0.50
  precision: bf16
  grad_clip_norm: 0.0
  seed: 20260911

  num_workers: 4
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
  allow_tf32: true
  cudnn_benchmark: true
  compile: false

  # New directory => starts from random weights; rerunning resumes exactly.
  resume_mode: auto
  init_checkpoint: null
  checkpoint_dir: outputs/h384_200k/checkpoints

  quick_steps: 20
  quick_val_every: 10

eval:
  split: val
  bounds: physical
  overlap_thresholds_mm: [1.0, 2.0, 5.0]
  sampler_steps_grid: [25, 50, 100]
  guidance_grid: [1.0, 2.0]
  sampling_seeds: [104729, 130363, 155921]
  sensitivity_seeds: [104729, 130363, 155921, 181081, 205019]
