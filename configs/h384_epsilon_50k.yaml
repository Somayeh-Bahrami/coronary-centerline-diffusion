# Paired 50k pilot: epsilon-prediction control.

data:
  packaged_dir: data/processed/ds105_full

train:
  prediction_type: epsilon
  hidden_dim: 384
  batch_size: 16
  lr: 3.0e-4
  max_steps: 50000
  warmup_steps: 500
  eta_min_ratio: 0.01

  early_stopping: false
  early_stop_min_steps: 50000
  patience: 30
  min_delta: 1.0e-4

  val_every: 1000
  checkpoint_every: 1000
  milestone_every: 10000
  log_every: 50
  max_hours: 4.9

  cond_drop_prob: 0.10
  self_cond_p: 0.50
  precision: bf16
  grad_clip_norm: 0.0
  seed: 20260911

  num_workers: 4
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 2
  allow_tf32: true
  cudnn_benchmark: true
  compile: false

  coh_weight: 0.0
  edge_cache: null
  resume_mode: auto
  init_checkpoint: null
  checkpoint_dir: outputs/v_prediction_50k/epsilon

  quick_steps: 20
  quick_val_every: 10

eval:
  split: val
  bounds: physical
  ddim_steps: 100
  guidance: 2.0
  sampling_seeds: [104729, 130363, 155921, 181081, 205019]
  precision: fp32
