# Phase 1 default config

data:
  raw_dir: data/raw
  centerline_dir: data/processed/centerlines
  packaged_dir: data/processed/packaged_reordered   # <-- point at the new dataset
  splits_dir: data/splits                           # <-- dir, not splits_file

drr:
  n_views: 2
  motion_rotation_deg: 10.0
  motion_translation_mm: 8.0

train:
  hidden_dim: 384        # matches run 4 exactly -- single-variable A/B
  batch_size: 16
  lr: 1.0e-3
  max_steps: 100000
  patience: 30
  val_every: 200
  max_hours: 12.0
  checkpoint_dir: checkpoints_reorder_v1
  device: auto

eval:
  overlap_thresholds_mm: [1.0, 2.0, 5.0]